<link rel="manifest" id="manifest" href="manifest.zh.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">

<script>
// 在其他東西載入前決定語言，讓 <html lang>、標題與 manifest（Android 分享選單裡的名稱）一致
(function(){
  var ok = ["zh","ja","en"], lang = null;
  try { lang = new URLSearchParams(location.search).get("lang"); } catch(e){}
  if (ok.indexOf(lang) < 0) { try { lang = localStorage.getItem("livecams-lang"); } catch(e){} }
  if (ok.indexOf(lang) < 0) {
    var nav = (navigator.languages || [navigator.language || "en"]);
    lang = "en";
    for (var i = 0; i < nav.length; i++) {
      var l = String(nav[i]).toLowerCase();
      if (l.indexOf("ja") === 0) { lang = "ja"; break; }
      if (l.indexOf("zh") === 0) { lang = "zh"; break; }
      if (l.indexOf("en") === 0) { lang = "en"; break; }
    }
  }
  window.INITIAL_LANG = lang;
  document.documentElement.lang = { zh:"zh-Hant", ja:"ja", en:"en" }[lang];
  document.getElementById("manifest").href = "manifest." + lang + ".webmanifest";
})();
</script>
<style>
/* 版面：頂部工具列 + 自適應鏡頭格（手機一欄、寬螢幕兩到三欄） */
:root{
  --bg:#eef1f3; --panel:#ffffff; --fg:#1b2329; --muted:#5d6b75; --line:#d5dbe0;
  --accent:#1f6f8b; --live:#d6402f;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
/* 漢字字形依語言切換，避免日文頁面出現中文字形（反之亦然） */
:root:lang(zh-Hant){--sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
:root:lang(ja){--sans:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171b; --panel:#1b2228; --fg:#e4e9ec; --muted:#93a1ab; --line:#2c363e;
  --accent:#5fb3cf; --live:#ff6a57; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.35rem;margin:0;letter-spacing:.02em}
.clock{font-family:var(--mono);color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{border:0;border-radius:0;padding:6px 10px;font-size:.85rem}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.empty{color:var(--muted);padding:24px 0}
.cam{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.screen{position:relative;aspect-ratio:16/9;background:#000;max-width:100%}
.screen iframe,.screen img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
.screen .linkonly{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:#cfd8dd;font-size:.9rem}
.badge{position:absolute;top:8px;left:8px;background:var(--live);color:#fff;font-size:.7rem;font-weight:700;
  letter-spacing:.08em;padding:2px 8px;border-radius:4px}
.meta{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.meta h2{font-size:1rem;margin:0}
.meta .sub{color:var(--muted);font-size:.82rem}
.meta .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.meta a{color:var(--accent)}
.meta .del{margin-left:auto;font-size:.8rem;padding:2px 8px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);width:min(520px,92vw)}
dialog form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.hint{font-size:.8rem;color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:flex-end}
textarea{font:13px/1.4 var(--mono);padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.search{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px;margin-bottom:16px}
.search input{flex:1 1 240px;min-width:0}
.search .hint{flex-basis:100%;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:.8rem;color:var(--muted)}
.chips button{font-size:.8rem;padding:4px 10px;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#f-error,#in-error{color:var(--live)}
#f-error:empty,#in-error:empty{display:none}
.incoming{max-width:720px;background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:16px;
  display:flex;flex-direction:column;gap:12px;font-size:1.05rem}
.incoming h2{margin:0;font-size:1.25rem}
.incoming .screen{border-radius:8px;overflow:hidden}
.incoming input{font-size:1.05rem}
.incoming .big{display:flex;gap:10px;flex-wrap:wrap}
.incoming .big button{flex:1 1 140px;font-size:1.2rem;padding:14px 16px;border-radius:10px}
details.help{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
details.help summary{cursor:pointer;font-weight:600}
details.help h3{font-size:.95rem;margin:14px 0 4px}
details.help ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
details.help code{font-family:var(--mono);font-size:.8rem;background:var(--bg);padding:1px 4px;border-radius:4px;word-break:break-all}
.bookmarklet{display:inline-block;background:var(--accent);color:#fff!important;text-decoration:none;padding:4px 12px;border-radius:999px;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1 data-i="appName"></h1>
  <span class="clock" id="clock"></span>
  <div class="head-actions">
    <div class="langs" id="langs" role="group" data-i-aria="language">
      <button type="button" data-lang="zh" lang="zh-Hant">中文</button>
      <button type="button" data-lang="ja" lang="ja">日本語</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <button id="addBtn" class="primary" data-i="add"></button>
    <button id="resetBtn" data-i="reset" data-i-title="resetTitle"></button>
  </div>
</header>

<form class="search" id="search">
  <label for="q" class="sr" data-i="searchLabel"></label>
  <input id="q" type="search" data-i-ph="searchPh" autocomplete="off">
  <div class="chips" id="suffix" role="group" data-i-aria="searchLang">
    <span class="lbl" data-i="searchLang"></span>
    <button type="button" data-k="en" data-s="live cam"></button>
    <button type="button" data-k="ja" data-s="ライブカメラ"></button>
    <button type="button" data-k="zh" data-s="即時影像"></button>
  </div>
  <button class="primary" type="submit" data-i="searchBtn"></button>
  <p class="hint" data-i="searchHint"></p>
</form>

<section class="incoming" id="incoming" hidden aria-live="polite">
  <h2 data-i="inTitle"></h2>
  <div class="screen" id="in-preview"></div>
  <label><span data-i="name"></span><input id="in-name"></label>
  <label><span data-i="group"></span><input id="in-group" list="groups-in" data-i-ph="groupPh"><datalist id="groups-in"></datalist></label>
  <p class="hint" id="in-error" role="alert"></p>
  <div class="big">
    <button class="primary" id="in-ok" data-i="inOk"></button>
    <button id="in-cancel" data-i="inCancel"></button>
  </div>
</section>

<details class="help" id="help">
  <summary data-i="helpTitle"></summary>
  <div id="help-body"></div>
</details>

<nav class="tabs" id="tabs"></nav>
<main class="grid" id="grid"></main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <strong data-i="dlgTitle"></strong>
    <label><span data-i="urlLabel"></span>
      <textarea id="f-url" required rows="3" data-i-ph="urlPh"></textarea>
    </label>
    <p class="hint" id="f-detect"></p>
    <label><span data-i="type"></span>
      <select id="f-type">
        <option value="youtube" data-i="typeYoutube"></option>
        <option value="embed" data-i="typeEmbed"></option>
        <option value="image" data-i="typeImage"></option>
        <option value="link" data-i="typeLink"></option>
      </select>
    </label>
    <label><span data-i="name"></span><input id="f-name" required data-i-ph="namePh"></label>
    <label><span data-i="group"></span><input id="f-group" list="groups" data-i-ph="groupPh"><datalist id="groups"></datalist></label>
    <label><span data-i="note"></span><input id="f-note"></label>
    <p class="hint" id="f-error" role="alert"></p>
    <div class="actions">
      <button value="cancel" formnovalidate data-i="cancel"></button>
      <button value="ok" class="primary" data-i="ok"></button>
    </div>
  </form>
</dialog>

// ───────────── 預設鏡頭（名稱與說明依語言顯示） ─────────────
// 2026-11 查到的公開來源。YouTube 直播重開時影片 ID 會變，需更新。
// type:"link" 是官方網站自己的播放器，無法內嵌。分組以 "@key" 儲存，顯示時翻譯。
const DEFAULTS = [
  { id:"kawaguchiko", group:"@fuji",  type:"youtube", url:"https://www.youtube.com/watch?v=1Lri-i1mVYI" },
  { id:"fujiview",    group:"@fuji",  type:"youtube", url:"https://www.youtube.com/watch?v=6sin2Z5WM3I" },
  { id:"yamanaka",    group:"@fuji",  type:"youtube", url:"https://www.youtube.com/watch?v=WjVH-0qSwOw" },
  { id:"fujiyama",    group:"@fuji",  type:"youtube", url:"https://www.youtube.com/watch?v=_6nLps25Kws" },
  { id:"summit",      group:"@fuji",  type:"link",    url:"https://www.fujisan-climb.jp/livecamera/" },
  { id:"fujirice",    group:"@fuji",  type:"link",    url:"https://www.youtube.com/@fujirice_official/live" },
  { id:"shibuya",     group:"@world", type:"link",    url:"https://www.skylinewebcams.com/webcam/japan/kanto/tokyo/tokyo-shibuya-scramble-crossing.html" },
  { id:"times",       group:"@world", type:"link",    url:"https://www.earthcam.com/usa/newyork/timessquare/" },
  { id:"abbey",       group:"@world", type:"link",    url:"https://www.earthcam.com/world/england/london/abbeyroad/" },
  { id:"jackson",     group:"@world", type:"link",    url:"https://www.seejh.com/live" },
  { id:"utsjoki",     group:"@world", type:"link",    url:"https://www.skylinewebcams.com/webcam/finland/lapland/utsjoki/northern-lights.html" },
  { id:"auroramax",   group:"@world", type:"link",    url:"https://auroramax.com/live" },
];
const GROUP_KEYS = ["fav","fuji","world"];

// ───────────── 儲存（v2：預設鏡頭與內建分組以代號儲存） ─────────────
const KEY = "my-livecams-v2", OLD_KEY = "my-livecams-v1", LANG_KEY = "livecams-lang";
const copyDefaults = () => DEFAULTS.map(c => ({ ...c }));
// 把任何語言寫的內建分組名稱轉成代號，避免切換語言後出現別的語言的分組
function groupToKey(g){
  const v = String(g || "").trim();
  if (!v) return "";
  if (v.startsWith("@")) return v;
  for (const k of GROUP_KEYS) for (const l in I18N) if (I18N[l].groups[k] === v) return "@" + k;
  return v;
}
function migrate(list){
  return list.map(c => {
    const d = DEFAULTS.find(x => x.url === c.url && !c.id);
    if (d) return { ...d };
    return { ...c, group: groupToKey(c.group) };
  });
}
function load(){
  try {
    const v2 = localStorage.getItem(KEY);
    if (v2) return JSON.parse(v2);
    const v1 = localStorage.getItem(OLD_KEY);
    if (v1) { const m = migrate(JSON.parse(v1)); localStorage.setItem(KEY, JSON.stringify(m)); return m; }
  } catch {}
  return copyDefaults();
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cams)); } catch {} };
let cams = load();
let filter = "*";                       // "*" = 全部；其餘為儲存的分組值
let lang = window.INITIAL_LANG || "en";
const T = () => I18N[lang];

// ───────────── 顯示用工具 ─────────────
const $ = id => document.getElementById(id);
function esc(s){ return String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const camName  = c => c.id && T().cams[c.id] ? T().cams[c.id][0] : c.name;
const camNote  = c => c.id && T().cams[c.id] ? T().cams[c.id][1] : c.note;
const groupName = g => !g ? T().groups.none : g.startsWith("@") ? (T().groups[g.slice(1)] || g.slice(1)) : g;
function groupOptions(){
  const vals = new Set(["@fav", ...cams.map(c => c.group).filter(Boolean)]);
  return [...vals].map(g => `<option value="${esc(groupName(g))}">`).join("");
}

function ytId(u){
  const m = u.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/)([\w-]{11})(?![\w-])/);
  return m && m[1] !== "live_stream" ? m[1] : null;
}

function screenHTML(c){
  const title = esc(camName(c) || "");
  if (c.type === "youtube"){
    const id = ytId(c.url);
    if (id) return `<span class="badge">LIVE</span><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&hl=${lang === "zh" ? "zh-TW" : lang}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title="${title}"></iframe>`;
    const ch = c.url.match(/channel\/(UC[\w-]+)/);
    if (ch) return `<span class="badge">LIVE</span><iframe src="https://www.youtube-nocookie.com/embed/live_stream?channel=${ch[1]}&autoplay=1&mute=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy" title="${title}"></iframe>`;
  }
  if (c.type === "embed" && /^https:\/\//.test(c.url))
    return `<iframe src="${esc(c.url)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" loading="lazy" title="${title}"></iframe>`;
  if (c.type === "image") return `<img data-src="${esc(c.url)}" alt="${title}">`;
  return `<div class="linkonly">${T().linkOnly}</div>`;
}

function render(){
  const groups = ["*", ...new Set(cams.map(c => c.group || ""))];
  if (!groups.includes(filter)) filter = "*";
  $("tabs").innerHTML = groups.map((g,i) =>
    `<button aria-pressed="${g===filter}" data-gi="${i}">${esc(g === "*" ? T().groups.all : groupName(g))}</button>`).join("");
  $("tabs").dataset.groups = JSON.stringify(groups);
  const shown = cams.map((c,i) => ({c,i})).filter(({c}) => filter==="*" || (c.group||"")===filter);
  $("grid").innerHTML = shown.length ? shown.map(({c,i}) => {
    const note = camNote(c);
    return `
    <article class="cam">
      <div class="screen">${screenHTML(c)}</div>
      <div class="meta">
        <h2>${esc(camName(c))}</h2>
        <span class="sub">${esc(groupName(c.group))}${note ? esc(T().sep + note) : ""}</span>
        <div class="row">
          <a href="${esc(c.url)}" target="_blank" rel="noopener">${T().open}</a>
          <button class="del" data-i="${i}">${T().remove}</button>
        </div>
      </div>
    </article>`; }).join("") : `<p class="empty">${esc(T().empty)}</p>`;
  refreshImages();
}
function refreshImages(){
  document.querySelectorAll("img[data-src]").forEach(img => {
    const u = img.dataset.src;
    img.src = u + (u.includes("?") ? "&" : "?") + "_t=" + Date.now();
  });
}
setInterval(refreshImages, 5*60*1000);
function tick(){
  const now = new Date(), loc = { zh:"zh-TW", ja:"ja-JP", en:"en-GB" }[lang];
  const f = tz => now.toLocaleTimeString(loc, { timeZone:tz, hour12:false });
  $("clock").textContent = `${T().clockTW} ${f("Asia/Taipei")}${lang === "en" ? "  " : "　"}${T().clockJP} ${f("Asia/Tokyo")}`;
}
setInterval(tick, 1000);

// ───────────── 套用語言 ─────────────
const APP_URL = location.origin + location.pathname;
function applyLang(){
  const t = T();
  document.documentElement.lang = { zh:"zh-Hant", ja:"ja", en:"en" }[lang];
  document.title = t.appName;
  $("manifest").href = "manifest." + lang + ".webmanifest";
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
  document.querySelectorAll("[data-i-ph]").forEach(el => { el.placeholder = t[el.dataset.iPh]; });
  document.querySelectorAll("[data-i-title]").forEach(el => { el.title = t[el.dataset.iTitle]; });
  document.querySelectorAll("[data-i-aria]").forEach(el => { el.setAttribute("aria-label", t[el.dataset.iAria]); });
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll("#suffix button").forEach(b => { b.textContent = t.langNames[b.dataset.k]; });
  // 搜尋語言預設跟著介面語言
  document.querySelectorAll("#suffix button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === lang));
  // 說明：插入 iPhone 用網址與電腦用書籤
  $("help-body").innerHTML = t.help
    .replace("{code}", `<code id="ios-url"></code>`)
    .replace("{bm}", `<a class="bookmarklet" id="bookmarklet" href="#"></a>`);
  $("ios-url").textContent = APP_URL + "?url=";
  const bm = $("bookmarklet");
  bm.textContent = t.bookmarklet;
  bm.href = "javascript:location.href=" + JSON.stringify(APP_URL + "?url=") +
    "+encodeURIComponent(location.href)+'&title='+encodeURIComponent(document.title.replace(/ - YouTube$/,''))";
  bm.addEventListener("click", e => e.preventDefault());
  if ($("dlg").open) updateDetect();
  if (!$("incoming").hidden && pending) {
    $("groups-in").innerHTML = groupOptions();
    if (pendingGroup) $("in-group").value = groupName(pendingGroup);
    $("in-preview").innerHTML = screenHTML({ ...pending, name: $("in-name").value });
  } else if (!$("incoming").hidden && incomingError) {
    $("in-error").textContent = t[incomingError];
  }
  tick();
  render();
}
$("langs").onclick = e => {
  const b = e.target.closest("button[data-lang]"); if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  applyLang();
};

// ───────────── 分組、移除、重設 ─────────────
$("tabs").onclick = e => {
  const b = e.target.closest("button[data-gi]"); if (!b) return;
  filter = JSON.parse($("tabs").dataset.groups)[+b.dataset.gi]; render();
};
$("grid").onclick = e => { const i = e.target.dataset.i; if (i !== undefined){ cams.splice(+i,1); save(); render(); } };
$("resetBtn").onclick = () => { cams = copyDefaults(); save(); render(); };

// ───────────── YouTube 搜尋：開新分頁，只列出直播中 ─────────────
$("suffix").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  $("suffix").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
};
$("search").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("q").value.trim();
  const s = $("suffix").querySelector('[aria-pressed="true"]')?.dataset.s || "";
  const query = [q, s].filter(Boolean).join(" ");
  const url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query) + "&sp=EgJAAQ%253D%253D";
  const a = Object.assign(document.createElement("a"), { href:url, target:"_blank", rel:"noopener" });
  document.body.appendChild(a); a.click(); a.remove();
});

// ───────────── 新增鏡頭：自動判斷貼上的內容 ─────────────
const dlg = $("dlg");
// 回傳 { type, url } 或 { error: 錯誤代號 }
function parseInput(raw){
  const t = raw.trim();
  if (/<iframe/i.test(t)){
    const f = new DOMParser().parseFromString(t, "text/html").querySelector("iframe");
    const src = (f?.getAttribute("src") || "").replace(/^\/\//, "https://");
    if (!src) return { error:"errNoSrc" };
    if (!/^https:\/\//.test(src)) return { error:"errHttps" };
    if (ytId(src)) return { type:"youtube", url:"https://www.youtube.com/watch?v=" + ytId(src) };
    return { type:"embed", url:src };
  }
  if (!/^https?:\/\//.test(t)) return { error:"errInput" };
  if (/youtube\.com|youtu\.be/.test(t) && (ytId(t) || /channel\/UC/.test(t))) return { type:"youtube", url:t };
  if (/\.(jpe?g|png|gif|webp)(\?|$)/i.test(t)) return { type:"image", url:t };
  return { type:"link", url:t };
}
function fetchTitle(url, input){
  fetch("https://noembed.com/embed?url=" + encodeURIComponent(url)).then(x => x.json())
    .then(j => { if (j.title && !input.value) input.value = j.title.slice(0, 80); }).catch(() => {});
}
function updateDetect(setType){
  const t = T(), raw = $("f-url").value;
  if (!raw.trim()) { $("f-detect").textContent = t.detectIdle; return null; }
  const r = parseInput(raw);
  if (r.error) { $("f-detect").textContent = t[r.error]; return null; }
  if (setType) $("f-type").value = r.type;
  $("f-detect").textContent = t.detected + t.typeShort[r.type] + (r.type === "embed" ? t.embedUrl.replace("{u}", r.url) : "");
  return r;
}
$("f-url").addEventListener("input", () => {
  const r = updateDetect(true);
  if (r && r.type === "youtube" && !$("f-name").value) fetchTitle(r.url, $("f-name"));
});
$("addBtn").onclick = () => {
  $("form").reset();
  $("f-error").textContent = "";
  updateDetect();
  $("f-group").value = filter === "*" ? "" : groupName(filter);
  $("groups").innerHTML = groupOptions();
  dlg.showModal();
};
$("form").addEventListener("submit", e => {
  if (e.submitter?.value !== "ok") return;          // 取消：直接關閉
  e.preventDefault();
  const t = T(), r = parseInput($("f-url").value);
  if (r.error) { $("f-error").textContent = t[r.error]; return; }
  const type = $("f-type").value;
  if (type === "embed" && !/^https:\/\//.test(r.url)) { $("f-error").textContent = t.errHttps; return; }
  if (type === "youtube" && !ytId(r.url) && !/channel\/UC/.test(r.url)) { $("f-error").textContent = t.errYoutube; return; }
  cams.push({ name:$("f-name").value.trim(), group:groupToKey($("f-group").value), type, url:r.url, note:$("f-note").value.trim() });
  save(); render(); dlg.close();
});

// ───────────── 從分享選單、捷徑或書籤收到的鏡頭 ─────────────
let pending = null, pendingGroup = "@fav", incomingError = "";
function showIncoming(){
  const params = new URLSearchParams(location.search);
  const blob = [params.get("url"), params.get("text"), params.get("title")].filter(Boolean).join(" ");
  if (!blob) return;
  const found = blob.match(/https?:\/\/[^\s"'<>]+/);
  history.replaceState(null, "", location.pathname);       // 清掉網址參數，重新整理時不會再問一次
  $("incoming").hidden = false;
  const fail = key => { incomingError = key; $("in-error").textContent = T()[key]; $("in-ok").disabled = true; };
  if (!found) return fail("noUrl");
  const r = parseInput(found[0]);
  if (r.error) return fail(r.error);
  pending = r;
  // Android 會把標題放在 title，或放在網址前面的文字裡
  const title = (params.get("title") || blob.replace(found[0], "")).replace(/ - YouTube$/, "").trim();
  $("in-name").value = title.slice(0, 80);
  $("groups-in").innerHTML = groupOptions();
  $("in-group").value = groupName(pendingGroup);
  $("in-preview").innerHTML = screenHTML({ ...r, name: title });
  refreshImages();
  if (!title && r.type === "youtube") fetchTitle(r.url, $("in-name"));
  $("incoming").scrollIntoView({ block: "start" });
}
$("in-group").addEventListener("input", () => { pendingGroup = groupToKey($("in-group").value); });
$("in-ok").onclick = () => {
  if (!pending) return;
  const group = groupToKey($("in-group").value) || "@fav";
  cams.push({ name: $("in-name").value.trim() || T().newCam, group, type: pending.type, url: pending.url, note: "" });
  save(); filter = group; pending = null;
  $("incoming").hidden = true; $("in-preview").innerHTML = "";
  render();
};
$("in-cancel").onclick = () => { pending = null; $("incoming").hidden = true; $("in-preview").innerHTML = ""; };

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
applyLang();
showIncoming();
</script>
