<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的ライブカメラ</title>
<style>
/* 版面：頂部工具列 + 自適應鏡頭格（手機一欄、寬螢幕兩到三欄） */
:root{
  --bg:#eef1f3; --panel:#ffffff; --fg:#1b2329; --muted:#5d6b75; --line:#d5dbe0;
  --accent:#1f6f8b; --live:#d6402f;
  --sans:"Noto Sans TC","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171b; --panel:#1b2228; --fg:#e4e9ec; --muted:#93a1ab; --line:#2c363e;
  --accent:#5fb3cf; --live:#ff6a57; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.35rem;margin:0;letter-spacing:.02em}
.clock{font-family:var(--mono);color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.cam{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.screen{position:relative;aspect-ratio:16/9;background:#000;max-width:100%}
.screen iframe,.screen img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
.screen .linkonly{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:#cfd8dd;font-size:.9rem}
.badge{position:absolute;top:8px;left:8px;background:var(--live);color:#fff;font-size:.7rem;font-weight:700;
  letter-spacing:.08em;padding:2px 8px;border-radius:4px}
.meta{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.meta h2{font-size:1rem;margin:0}
.meta .sub{color:var(--muted);font-size:.82rem}
.meta .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.meta a{color:var(--accent)}
.meta .del{margin-left:auto;font-size:.8rem;padding:2px 8px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);width:min(520px,92vw)}
dialog form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.hint{font-size:.8rem;color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:flex-end}
textarea{font:13px/1.4 var(--mono);padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.search{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px;margin-bottom:16px}
.search input{flex:1 1 240px;min-width:0}
.search .hint{flex-basis:100%;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:.8rem;padding:4px 10px;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#f-error{color:var(--live)}
#f-error:empty{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>我的ライブカメラ</h1>
  <span class="clock" id="clock"></span>
  <div style="display:flex;gap:8px">
    <button id="addBtn" class="primary">＋ 新增鏡頭</button>
    <button id="resetBtn" title="恢復預設清單">重設</button>
  </div>
</header>
<form class="search" id="search">
  <label for="q" class="sr">搜尋 YouTube 直播</label>
  <input id="q" type="search" placeholder="想看哪裡？例如：京都 嵐山、Venice、Hawaii beach" autocomplete="off">
  <div class="chips" id="suffix" role="group" aria-label="搜尋關鍵字">
    <button type="button" data-s="live cam" aria-pressed="true">live cam</button>
    <button type="button" data-s="ライブカメラ" aria-pressed="false">ライブカメラ</button>
    <button type="button" data-s="即時影像" aria-pressed="false">即時影像</button>
  </div>
  <button class="primary" type="submit">在 YouTube 搜尋直播 ↗</button>
  <p class="hint">會在新分頁開啟 YouTube，只列出「正在直播」的影片。找到喜歡的，複製網址回來按「＋ 新增鏡頭」貼上。</p>
</form>
<nav class="tabs" id="tabs"></nav>
<main class="grid" id="grid"></main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <strong>新增鏡頭</strong>
    <label>網址或嵌入碼
      <textarea id="f-url" required rows="3" placeholder="貼上 YouTube 網址、圖片網址、網頁網址，或 <iframe …> 嵌入碼"></textarea>
    </label>
    <p class="hint" id="f-detect">貼上後會自動判斷類型。</p>
    <label>類型
      <select id="f-type">
        <option value="youtube">YouTube 直播</option>
        <option value="embed">嵌入碼（網站提供的 iframe）</option>
        <option value="image">靜態圖片（每 5 分鐘更新）</option>
        <option value="link">只放連結</option>
      </select>
    </label>
    <label>名稱<input id="f-name" required placeholder="例如：京都 嵐山 渡月橋"></label>
    <label>分組<input id="f-group" list="groups" placeholder="例如：京都"><datalist id="groups"></datalist></label>
    <label>說明（選填）<input id="f-note"></label>
    <p class="hint" id="f-error" role="alert"></p>
    <div class="actions">
      <button value="cancel" formnovalidate>取消</button>
      <button value="ok" class="primary">加入</button>
    </div>
  </form>
</dialog>

<script>
// 預設清單（2026-11 查到的公開來源）。YouTube 直播重開時影片 ID 會變，需更新。
// type:"link" 是官方網站自己的播放器，無法內嵌，只放連結。
const DEFAULTS = [
  { group:"富士山", name:"富士山 河口湖駅前", type:"youtube",
    url:"https://www.youtube.com/watch?v=1Lri-i1mVYI", note:"24 小時配信" },
  { group:"富士山", name:"富士ビューホテル（河口湖畔）", type:"youtube",
    url:"https://www.youtube.com/watch?v=6sin2Z5WM3I", note:"24 小時配信" },
  { group:"富士山", name:"山中湖 芙蓉台", type:"youtube",
    url:"https://www.youtube.com/watch?v=WjVH-0qSwOw", note:"約 30 秒延遲" },
  { group:"富士山", name:"FUJIYAMAタワー（富士急ハイランド）", type:"youtube",
    url:"https://www.youtube.com/watch?v=_6nLps25Kws", note:"展望台視角" },
  { group:"富士山", name:"富士山頂 剣ヶ峰", type:"link",
    url:"https://www.fujisan-climb.jp/livecamera/", note:"只在夏季開山期配信" },
  { group:"富士山", name:"FUJI RICE 富士宮の田んぼ", type:"link",
    url:"https://www.youtube.com/@fujirice_official/live", note:"頻道直播頁" },
  { group:"世界", name:"渋谷スクランブル交差点", type:"link",
    url:"https://www.skylinewebcams.com/webcam/japan/kanto/tokyo/tokyo-shibuya-scramble-crossing.html", note:"SkylineWebcams・東京" },
  { group:"世界", name:"Times Square", type:"link",
    url:"https://www.earthcam.com/usa/newyork/timessquare/", note:"EarthCam・紐約" },
  { group:"世界", name:"Abbey Road 斑馬線", type:"link",
    url:"https://www.earthcam.com/world/england/london/abbeyroad/", note:"EarthCam・倫敦" },
  { group:"世界", name:"Jackson Hole Town Square", type:"link",
    url:"https://www.seejh.com/live", note:"SeeJH・美國懷俄明州" },
  { group:"世界", name:"北極光 Utsjoki", type:"link",
    url:"https://www.skylinewebcams.com/webcam/finland/lapland/utsjoki/northern-lights.html", note:"SkylineWebcams・芬蘭拉普蘭，冬季夜間" },
  { group:"世界", name:"AuroraMAX 北極光", type:"link",
    url:"https://auroramax.com/live", note:"加拿大 Yellowknife，冬季夜間" },
];
const KEY = "my-livecams-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || DEFAULTS.slice(); } catch { return DEFAULTS.slice(); } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cams)); } catch {} };
let cams = load();
let filter = "全部";

function ytId(u){
  const m = u.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/)([\w-]{11})(?![\w-])/);
  return m && m[1] !== "live_stream" ? m[1] : null;
}
function esc(s){ return String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function screenHTML(c){
  if (c.type === "youtube"){
    const id = ytId(c.url);
    if (id) return `<span class="badge">LIVE</span><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title="${esc(c.name)}"></iframe>`;
    // 頻道直播網址：https://www.youtube.com/channel/UCxxxx → 嵌入頻道目前的直播
    const ch = c.url.match(/channel\/(UC[\w-]+)/);
    if (ch) return `<span class="badge">LIVE</span><iframe src="https://www.youtube-nocookie.com/embed/live_stream?channel=${ch[1]}&autoplay=1&mute=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy"></iframe>`;
  }
  if (c.type === "embed" && /^https:\/\//.test(c.url))
    return `<iframe src="${esc(c.url)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" loading="lazy" title="${esc(c.name)}"></iframe>`;
  if (c.type === "image") return `<img data-src="${esc(c.url)}" alt="${esc(c.name)}">`;
  return `<div class="linkonly">這個鏡頭要在官方網站觀看<br>點下方「開啟原始頁面」</div>`;
}

function render(){
  const groups = ["全部", ...new Set(cams.map(c => c.group || "未分組"))];
  if (!groups.includes(filter)) filter = "全部";
  document.getElementById("tabs").innerHTML = groups.map(g =>
    `<button aria-pressed="${g===filter}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  document.getElementById("grid").innerHTML = cams.map((c,i) => ({c,i}))
    .filter(({c}) => filter==="全部" || (c.group||"未分組")===filter)
    .map(({c,i}) => `
    <article class="cam">
      <div class="screen">${screenHTML(c)}</div>
      <div class="meta">
        <h2>${esc(c.name)}</h2>
        <span class="sub">${esc(c.group||"")}${c.note ? "・"+esc(c.note) : ""}</span>
        <div class="row">
          <a href="${esc(c.url)}" target="_blank" rel="noopener">開啟原始頁面 ↗</a>
          <button class="del" data-i="${i}">移除</button>
        </div>
      </div>
    </article>`).join("");
  refreshImages();
}
function refreshImages(){
  document.querySelectorAll("img[data-src]").forEach(img => {
    const u = img.dataset.src;
    img.src = u + (u.includes("?") ? "&" : "?") + "_t=" + Date.now();
  });
}
setInterval(refreshImages, 5*60*1000);
setInterval(() => { document.getElementById("clock").textContent =
  "台灣 " + new Date().toLocaleTimeString("zh-TW",{timeZone:"Asia/Taipei",hour12:false}) +
  "　日本 " + new Date().toLocaleTimeString("ja-JP",{timeZone:"Asia/Tokyo",hour12:false}); }, 1000);

document.getElementById("tabs").onclick = e => { const g = e.target.dataset.g; if (g){ filter = g; render(); } };
document.getElementById("grid").onclick = e => { const i = e.target.dataset.i; if (i !== undefined){ cams.splice(+i,1); save(); render(); } };
document.getElementById("resetBtn").onclick = () => { cams = DEFAULTS.slice(); save(); render(); };
// ── YouTube 搜尋：開新分頁，套用「直播中」篩選 ──
const suffixBox = document.getElementById("suffix");
suffixBox.onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  suffixBox.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
};
document.getElementById("search").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  const s = suffixBox.querySelector('[aria-pressed="true"]')?.dataset.s || "";
  const query = [q, s].filter(Boolean).join(" ");
  const url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query) + "&sp=EgJAAQ%253D%253D";
  const a = Object.assign(document.createElement("a"), { href:url, target:"_blank", rel:"noopener" });
  document.body.appendChild(a); a.click(); a.remove();
});

// ── 新增鏡頭：自動判斷貼上的內容 ──
const $ = id => document.getElementById(id);
const dlg = $("dlg");

// 從貼上的文字判斷類型，回傳 { type, url } 或 { error }
function parseInput(raw){
  const t = raw.trim();
  if (/<iframe/i.test(t)){
    const f = new DOMParser().parseFromString(t, "text/html").querySelector("iframe");
    const src = (f?.getAttribute("src") || "").replace(/^\/\//, "https://");
    if (!src) return { error:"嵌入碼裡找不到 src 網址，請確認貼上的是完整的 <iframe …> 程式碼。" };
    if (!/^https:\/\//.test(src)) return { error:"嵌入碼的網址必須是 https:// 開頭。" };
    if (ytId(src)) return { type:"youtube", url:"https://www.youtube.com/watch?v=" + ytId(src) };
    return { type:"embed", url:src };
  }
  if (!/^https?:\/\//.test(t)) return { error:"請貼上 https:// 開頭的網址或 <iframe> 嵌入碼。" };
  if (/youtube\.com|youtu\.be/.test(t) && (ytId(t) || /channel\/UC/.test(t))) return { type:"youtube", url:t };
  if (/\.(jpe?g|png|gif|webp)(\?|$)/i.test(t)) return { type:"image", url:t };
  return { type:"link", url:t };
}
const typeLabel = { youtube:"YouTube 直播", embed:"嵌入碼", image:"靜態圖片", link:"只放連結" };

$("f-url").addEventListener("input", async () => {
  const raw = $("f-url").value;
  if (!raw.trim()) { $("f-detect").textContent = "貼上後會自動判斷類型。"; return; }
  const r = parseInput(raw);
  if (r.error) { $("f-detect").textContent = r.error; return; }
  $("f-type").value = r.type;
  $("f-detect").textContent = "判斷為：" + typeLabel[r.type] + (r.type === "embed" ? "（網址：" + r.url + "）" : "");
  // YouTube 影片：嘗試自動帶入標題（失敗就讓使用者自己填）
  if (r.type === "youtube" && !$("f-name").value) {
    try {
      const res = await fetch("https://noembed.com/embed?url=" + encodeURIComponent(r.url));
      const j = await res.json();
      if (j.title && !$("f-name").value) $("f-name").value = j.title.slice(0, 80);
    } catch {}
  }
});

$("addBtn").onclick = () => {
  $("form").reset();
  $("f-error").textContent = "";
  $("f-detect").textContent = "貼上後會自動判斷類型。";
  $("f-group").value = filter === "全部" ? "" : filter;
  $("groups").innerHTML = [...new Set(cams.map(c => c.group).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join("");
  dlg.showModal();
};
$("form").addEventListener("submit", e => {
  if (e.submitter?.value !== "ok") return;          // 取消：直接關閉
  e.preventDefault();
  const r = parseInput($("f-url").value);
  if (r.error) { $("f-error").textContent = r.error; return; }
  const type = $("f-type").value;
  if (type === "embed" && !/^https:\/\//.test(r.url)) { $("f-error").textContent = "嵌入碼的網址必須是 https:// 開頭。"; return; }
  if (type === "youtube" && !ytId(r.url) && !/channel\/UC/.test(r.url)) {
    $("f-error").textContent = "這不是 YouTube 影片網址，請改選其他類型。"; return;
  }
  cams.push({ name:$("f-name").value.trim(), group:$("f-group").value.trim(), type, url:r.url, note:$("f-note").value.trim() });
  save(); render(); dlg.close();
});
render();
</script>
</body>
</html>
